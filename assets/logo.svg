<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#16204A"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- shield -->
  <path d="M256 58 L408 112 V250 C408 352 340 418 256 456 C172 418 104 352 104 250 V112 Z"
        fill="#0E1530" fill-opacity="0.85" stroke="url(#shield)" stroke-width="14" stroke-linejoin="round" filter="url(#softglow)"/>

  <!-- DNA helix strands -->
  <g fill="none" stroke-width="9" stroke-linecap="round" filter="url(#softglow)">
    <path d="M206 128 C306 168 306 208 206 248 C106 288 306 318 256 388" stroke="url(#strandA)" opacity="0.95"/>
    <path d="M306 128 C206 168 206 208 306 248 C406 288 206 318 256 388" stroke="url(#strandB)" opacity="0.95"/>
  </g>

  <!-- rungs / graph edges -->
  <g stroke="#7DD3FC" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="222" y1="140" x2="290" y2="140"/>
    <line x1="246" y1="178" x2="266" y2="178"/>
    <line x1="232" y1="226" x2="280" y2="226"/>
    <line x1="196" y1="282" x2="316" y2="282"/>
    <line x1="232" y1="334" x2="280" y2="334"/>
  </g>

  <!-- graph nodes -->
  <g filter="url(#glow)">
    <circle cx="206" cy="128" r="15" fill="#22D3EE"/>
    <circle cx="306" cy="128" r="15" fill="#A78BFA"/>
    <circle cx="256" cy="188" r="12" fill="#E0F2FE"/>
    <circle cx="206" cy="248" r="13" fill="#A78BFA"/>
    <circle cx="306" cy="248" r="13" fill="#22D3EE"/>
    <circle cx="256" cy="388" r="19" fill="#EF4444"/>
  </g>
  <circle cx="256" cy="388" r="30" fill="none" stroke="#EF4444" stroke-width="3" stroke-opacity="0.55"/>
</svg>
